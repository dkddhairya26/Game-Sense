name: Build public installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate analytics and provider parsing
        run: |
          python -m pip install pytest
          python -m pytest -q
          python -m compileall -q app.py gamesense
      - name: Build Windows desktop app
        run: python -m PyInstaller --noconfirm --clean --windowed --name GameSense --collect-all matplotlib --collect-all nba_api app.py
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Create Windows installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\GameSense.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: GameSense-Windows-Installer
          path: output/GameSenseSetup-Windows.exe
      - name: Publish public unsigned Windows beta
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.4.0-beta.1"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --prerelease --title "GameSense v0.4 beta" --notes "PREVIEW ONLY. Unsigned desktop installers. Real historical data coverage varies by sport and year. Demo records are fictional. Use at your own risk and report issues."
            if ($LASTEXITCODE -ne 0) { Start-Sleep -Seconds 3; gh release view $tag }
          }
          gh release upload $tag output/GameSenseSetup-Windows.exe --clobber
      - name: Publish Windows installer on tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $env:GITHUB_REF_NAME --title $env:GITHUB_REF_NAME --notes "GameSense desktop release. Demo data is fictional; import datasets for analysis." }
          gh release upload $env:GITHUB_REF_NAME output/GameSenseSetup-Windows.exe --clobber
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate analytics and provider parsing
        run: |
          python -m pip install pytest
          python -m pytest -q
          python -m compileall -q app.py gamesense
      - name: Build Mac app
        run: python -m PyInstaller --noconfirm --clean --windowed --name GameSense --collect-all matplotlib --collect-all nba_api app.py
      - name: Create DMG
        run: |
          mkdir -p dmg
          cp -R dist/GameSense.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname GameSense -srcfolder dmg -ov -format UDZO GameSense-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: GameSense-macOS-DMG
          path: GameSense-macOS.dmg
      - name: Publish public unsigned macOS beta
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v0.4.0-beta.1
          gh release view "$TAG" || (gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --title "GameSense v0.4 beta" --notes "PREVIEW ONLY. Unsigned desktop installers. Historical data coverage varies and demo records are fictional." || (sleep 3 && gh release view "$TAG"))
          gh release upload "$TAG" GameSense-macOS.dmg --clobber
      - name: Publish macOS DMG on tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "GameSense desktop release. Demo data is fictional; import datasets for analysis."
          gh release upload "$GITHUB_REF_NAME" GameSense-macOS.dmg --clobber
