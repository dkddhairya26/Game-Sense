name: Build and verify desktop installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            installer: GameSenseSetup-Windows.exe
          - os: macos-latest
            platform: macOS
            installer: GameSense-macOS.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Check version tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: python -c "import os; from scripts.build import VERSION; tag = os.environ['GITHUB_REF_NAME']; assert tag == 'v' + VERSION or tag.startswith('v' + VERSION + '-'), 'Tag must match scripts/build.py VERSION'"
      - name: Run analytics, provider and cache tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q --junitxml=output/test-results-${{ matrix.platform }}.xml
      - name: Verify pinned redistributable starter and render native source screens
        env:
          QT_QPA_PLATFORM: offscreen
          GAMESENSE_DATA_DIR: ${{ runner.temp }}/gamesense-final-smoke
        run: |
          python -c "from pathlib import Path; assert Path('data/seed_soccer_cc0.jsonl.gz').stat().st_size > 1000000, 'Verified club seed must be committed with release source'"
          python app.py --smoke-test --screenshots output/screenshots-${{ matrix.platform }}
      - name: Run final native acceptance cases
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/final_acceptance.py --output output/acceptance-${{ matrix.platform }}
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y
      - name: Build native application and installer
        run: python scripts/build.py --installer
      - name: Check install and native startup
        run: python scripts/check_package.py --installer output/${{ matrix.installer }} --report output/package-check-${{ matrix.platform }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GameSense-${{ matrix.platform }}
          path: output/*
          if-no-files-found: error
  publish-preview:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: GameSense-*
          path: release-assets
          merge-multiple: true
      - name: Package actual cross-platform verification evidence
        run: python scripts/package_evidence.py --artifacts release-assets --output release-assets/GameSense-Verification-Evidence.zip
      - name: Publish a new preview without replacing existing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite it. Use a new version tag."
            exit 1
          fi
          test -s release-assets/GameSenseSetup-Windows.exe
          test -s release-assets/GameSense-macOS.dmg
          gh release create "$GITHUB_REF_NAME" release-assets/*.exe release-assets/*.dmg release-assets/*.txt release-assets/*.json release-assets/*.xml release-assets/*.zip --prerelease --latest=false --verify-tag --title "GameSense $GITHUB_REF_NAME (Final Analytics Beta)" --notes-file docs/RELEASE_NOTES.md
