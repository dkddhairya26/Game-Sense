name: Build public installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build Windows desktop app
        run: python -m PyInstaller --noconfirm --clean --windowed --name GameSense --collect-all matplotlib app.py
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Create Windows installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\GameSense.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: GameSense-Windows-Installer
          path: output/GameSenseSetup-Windows.exe
      - name: Attach Windows installer to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release upload $env:GITHUB_REF_NAME output/GameSenseSetup-Windows.exe --clobber
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build Mac app
        run: python -m PyInstaller --noconfirm --clean --windowed --name GameSense --collect-all matplotlib app.py
      - name: Create DMG
        run: |
          mkdir -p dmg
          cp -R dist/GameSense.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname GameSense -srcfolder dmg -ov -format UDZO GameSense-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: GameSense-macOS-DMG
          path: GameSense-macOS.dmg
      - name: Attach Mac DMG to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" GameSense-macOS.dmg --clobber
