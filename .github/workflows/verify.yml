name: Verify final desktop source
on:
  push:
    branches: [codex/gamesense-final-assessment]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Verify analytics and native behavior
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q --junitxml=output/tests-${{ matrix.os }}.xml
      - name: Exercise final native acceptance cases
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/final_acceptance.py --output output/acceptance-${{ matrix.os }}
      - name: Retain review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GameSense-source-${{ matrix.os }}
          path: output/**
          if-no-files-found: warn
