name: Verify preview desktop packages
on:
  push:
    branches:
      - feature/real-history-and-multi-chart-dashboard
  pull_request:
    paths:
      - 'app.py'
      - 'gamesense/**'
      - 'tests/**'
      - 'assets/**'
      - 'data/**'
      - 'scripts/**'
      - 'installer/**'
      - 'requirements.txt'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            installer: GameSenseSetup-Windows.exe
          - os: macos-latest
            platform: macOS
            installer: GameSense-macOS.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Check analytics, providers, portraits and chart rendering
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q --junitxml=output/test-results-${{ matrix.platform }}.xml
      - name: Render native source screenshots
        env:
          QT_QPA_PLATFORM: offscreen
          GAMESENSE_DATA_DIR: ${{ runner.temp }}/gamesense-preview-data
        run: python app.py --smoke-test --screenshots output/screenshots
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y
      - name: Build native installer
        run: python scripts/build.py --installer
      - name: Check packaged native startup and installer
        run: python scripts/check_package.py --installer output/${{ matrix.installer }} --report output/package-check-${{ matrix.platform }}.json
      - name: Retain review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GameSense-preview-${{ matrix.platform }}
          path: output/**
          if-no-files-found: warn
