name: Validate historical connectors and premium dashboards
on:
  push:
    branches:
      - feature/football-leagues-afl-stats-v08
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gamesense-development-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libglib2.0-0 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile project and run full test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m compileall -q app.py gamesense
          python -m pytest -q --junitxml=output/feature-tests.xml
      - name: Capture real offscreen native UI
        env:
          QT_QPA_PLATFORM: offscreen
          GAMESENSE_DATA_DIR: ${{ runner.temp }}/gamesense-visual-check
        run: python app.py --smoke-test --screenshots output/screenshots
      - name: Upload tests and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GameSense-Real-History-Preview
          path: output/**
          if-no-files-found: warn
